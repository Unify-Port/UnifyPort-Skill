name: ClawHub release

on:
  pull_request:
    paths:
      - skills/unifyport-device-api/**
      - scripts/**
      - tests/**
      - docs/public-contract-review.json
      - package.json
      - .github/workflows/clawhub.yml
  workflow_dispatch:
    inputs:
      publisher_handle:
        description: Type unifyport to confirm the exact ClawHub publishing account
        required: true
        type: string
      confirm_publish:
        description: Publish the validated main-branch bundle to @unifyport
        required: true
        type: boolean
        default: false

concurrency:
  group: clawhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Validate explicit version and dry run or manually publish
    # PR 永远只 dry-run；正式发布仍须 main、固定账号输入与明确手工确认。
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && inputs.publisher_handle == 'unifyport')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 固定 CLI 的 Node 版本要求 >=22；发布使用 Node 24 的原生 multipart transport。
          node-version: 24.x
      - run: npm run check
      - name: Require current human approval before publishing
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true
        run: node scripts/check-release.mjs --require-human-review
      - name: Record exact local release manifest
        run: node scripts/check-release.mjs > "$RUNNER_TEMP/release-plan.json"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      # 原 reusable workflow 不接收显式 version；固定同一 CLI 并由本仓库传入统一版本。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openclaw/clawhub
          ref: ed9c8fdda2119176ba21d33e81823f8de79a6960
          path: clawhub-source
          persist-credentials: false
      - name: Install pinned official ClawHub CLI
        working-directory: clawhub-source
        run: bun install --frozen-lockfile
      # Bun 仅安装依赖；构建后的 CLI 用 Node 执行，避免 curl -F 解释 JSON 正文。
      - name: Build pinned official ClawHub CLI for Node.js
        working-directory: clawhub-source/packages/clawhub
        run: node scripts/build.mjs
      - name: Verify official multipart transport without publishing
        env:
          CLAWHUB_CLI_ENTRY: ${{ github.workspace }}/clawhub-source/packages/clawhub/dist/cli.js
        run: node --test tests/integration/clawhub-transport.test.mjs
      - name: Run explicit-version ClawHub command
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true }}
          CLAWHUB_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true && secrets.CLAWHUB_TOKEN || '' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            node scripts/run-clawhub-release.mjs --cli-entry clawhub-source/packages/clawhub/dist/cli.js --publish > "$RUNNER_TEMP/clawhub-result.json"
          else
            node scripts/run-clawhub-release.mjs --cli-entry clawhub-source/packages/clawhub/dist/cli.js > "$RUNNER_TEMP/clawhub-result.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clawhub-release-plan
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/clawhub-result.json
          if-no-files-found: error
